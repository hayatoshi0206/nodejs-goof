version: "2"
services:
  goof:
    build: .
    container_name: goof
    environment:
      - DOCKER=1
      - MYSQL_HOST=goof-mysql
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
    ports:
      - "3001:3001"
    links:
      - goof-mongo
    depends_on:
      - goof-mongo
  goof-mongo:
    container_name: goof-mongo
    image: mongo:3
    ports:
      - "127.0.0.1:27017:27017"
  good-mysql:
    container_name: goof-mysql
    image: mysql:5
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: acme
    ports:
      - "127.0.0.1:3306:3306"
